name: Site container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build --tag astro-site-starter:verify .
      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' astro-site-starter:verify)" = "1000:1000"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' astro-site-starter:verify)" = '{"4321/tcp":{}}'
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' astro-site-starter:verify)" = '["CMD","node","/app/healthcheck.mjs"]'
